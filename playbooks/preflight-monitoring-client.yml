---
- name: Check private connectivity to central monitoring
  hosts: monitoring_clients
  gather_facts: false
  tasks:
    - name: Validate central endpoint configuration
      ansible.builtin.assert:
        that:
          - monitoring_endpoint_host is defined
          - monitoring_endpoint_host | string | length > 0
        fail_msg: "Central monitoring endpoint is not configured."
      no_log: true

    - name: Check Prometheus remote-write port
      ansible.builtin.wait_for:
        host: "{{ monitoring_endpoint_host }}"
        port: "{{ prometheus_remote_write_port }}"
        state: started
        connect_timeout: 3
        timeout: 8
      no_log: true

    - name: Check Loki push port
      ansible.builtin.wait_for:
        host: "{{ monitoring_endpoint_host }}"
        port: "{{ loki_push_port }}"
        state: started
        connect_timeout: 3
        timeout: 8
      no_log: true

    - name: Report connectivity result
      ansible.builtin.debug:
        msg: "Prometheus and Loki ports are reachable from monitoring clients."
