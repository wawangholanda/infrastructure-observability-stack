---
# Official Docker APT repository settings.
docker_engine_apt_keyring: /etc/apt/keyrings/docker.asc

docker_engine_apt_repositories:
  Debian: https://download.docker.com/linux/debian
  Ubuntu: https://download.docker.com/linux/ubuntu

docker_engine_apt_key_urls:
  Debian: https://download.docker.com/linux/debian/gpg
  Ubuntu: https://download.docker.com/linux/ubuntu/gpg

# Supported releases are validated per operating system.
docker_engine_supported_releases:
  Debian:
    - bullseye
    - bookworm
    - trixie
  Ubuntu:
    - jammy
    - noble
    - resolute

# Install Docker Engine and the Compose v2 plugin.
docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_engine_service_name: docker
